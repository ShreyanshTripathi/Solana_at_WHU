# Fly.io: one always-on machine in Frankfurt with a 1 GB volume for the database, keys and models.
# Change `app` to a name that's free (it becomes <app>.fly.dev).
app = "volty-demo"
primary_region = "fra"

[build]

[env]
  # One-click demo logins for the judges. Payments are on Solana devnet (test money only).
  DEMO_LOGIN = "true"
  # Its own on-chain roof accounts, so this copy's database and a local one never pay into the same roof.
  ROOF_ID_PREFIX = "web-"

[http_service]
  internal_port = 3000
  force_https = true
  # The live demo runs inside the server for minutes; a stopped machine would cut it off.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "volty_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# Room for the voice models next to Next.js.
swap_size_mb = 1024
